<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The GeoPacts</title>
    <meta name="description" content="The GeoPacts is a modern global news and information platform covering world affairs, politics, business, technology, science, culture, and other important developments shaping our world." />
    <meta name="application-name" content="The GeoPacts" />
    <meta name="apple-mobile-web-app-title" content="The GeoPacts" />
    
    <!-- Open Graph -->
    <meta property="og:site_name" content="The GeoPacts" />
    <meta property="og:title" content="The GeoPacts" />
    <meta property="og:description" content="The GeoPacts is a modern global news and information platform covering world affairs, politics, business, technology, science, culture, and other important developments shaping our world." />
    <meta property="og:type" content="website" />
    
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The GeoPacts" />
    <meta name="twitter:description" content="The GeoPacts is a modern global news and information platform covering world affairs, politics, business, technology, science, culture, and other important developments shaping our world." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Structured Data: Organization & WebSite Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://thegeopacts.com/#organization",
          "name": "The GeoPacts",
          "url": "https://thegeopacts.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=800&auto=format&fit=crop&q=80",
            "caption": "The GeoPacts Logo"
          },
          "publishingPrinciples": "https://thegeopacts.com/editorial-policy",
          "correctionsPolicy": "https://thegeopacts.com/corrections"
        },
        {
          "@type": "WebSite",
          "@id": "https://thegeopacts.com/#website",
          "url": "https://thegeopacts.com",
          "name": "The GeoPacts",
          "alternateName": "The GeoPacts",
          "publisher": {
            "@id": "https://thegeopacts.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://thegeopacts.com/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#f8f9fa] text-[#1e293b] antialiased selection:bg-red-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
